name: Metrics
on:
  # Refresh every 6 hours, and on demand from the Actions tab
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.SECRET_ARUN_PROFILIE }}
          user: Arun-projectdumps
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large

          # 3D contributions calendar + streak / commits per day
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits: commits per hour / per day + language activity
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_trim: yes

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: batchfile, shell

          # Mastered technologies and topics (icons)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          # Achievements (fills the slot PageSpeed/Music use in the example)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8
