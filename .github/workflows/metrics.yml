name: Metrics
on:
  # Refresh every 6 hours, and on demand from the Actions tab
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.SECRET_ARUN_PROFILIE }}
          user: Arun-projectdumps
          filename: metrics.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large

          # Hide repository stats that are zero (keeps Packages)
          extras_js: |
            document.querySelectorAll('.field').forEach(f => {
              if (/^0 (Sponsors|Stargazers|Forkers|Watchers)$/.test(f.textContent.trim())) f.remove()
            })

          # 3D contributions calendar + streak / commits per day
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year


          # Most used languages bar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: batchfile, shell
